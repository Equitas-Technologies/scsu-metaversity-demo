name: Azure test and staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      target:
        description: Azure preview environment
        required: true
        type: choice
        options: [test, staging]

permissions:
  contents: read

concurrency:
  group: azure-${{ github.event_name == 'push' && 'staging' || inputs.target }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    env:
      MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          for script in config.js js/*.js scripts/build-site.js; do
            node --check "$script"
          done
      - name: Package the public site
        run: node scripts/build-site.js output/azure-site
      - name: Deploy named preview environment
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: output/azure-site
          api_location: ''
          output_location: ''
          skip_app_build: true
          deployment_environment: ${{ github.event_name == 'push' && 'staging' || inputs.target }}
